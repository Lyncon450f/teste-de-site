<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon FireRed — GBA WebAssembly</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#f0f6fc;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
.wrap{width:min(1000px,95vw);padding:24px}.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:24px;box-shadow:0 20px 70px #0008}
h1{margin:0 0 8px;color:#f2cc60;font-size:clamp(25px,4vw,42px)}p{color:#c9d1d9;line-height:1.55}.notice{background:#21262d;border:1px solid #484f58;padding:14px;border-radius:10px;margin:18px 0}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.scale{display:flex;align-items:center;gap:8px;color:#c9d1d9;font-size:14px}.scale select{background:#21262d;color:#f0f6fc;border:1px solid #484f58;border-radius:8px;padding:11px 12px;font-weight:700}.scale b{color:#f2cc60}.file{padding:12px 16px;background:#f2cc60;color:#111;font-weight:800;border-radius:9px;cursor:pointer}.file input{display:none}
#status{font-size:14px;color:#8b949e}#game{width:100%;margin-top:20px;background:#000;border-radius:12px;min-height:480px;display:grid;place-items:center;overflow:hidden}
canvas{width:min(720px,100%);height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}.small{font-size:12px;color:#8b949e;margin-top:14px}
</style></head>
<body><main class="wrap"><section class="card">
<h1>Pokémon FireRed</h1><p>Emulador GBA com <b>mGBA compilado para WebAssembly</b>.</p>
<div class="notice"><b>ROM:</b> o site não hospeda nem distribui a ROM. Escolha seu próprio arquivo <code>.gba</code>; ele permanece no navegador.</div>
<div class="controls"><label class="file">CARREGAR ROM .GBA<input id="rom" type="file" accept=".gba,application/octet-stream"></label><label class="scale"><b>ESCALA</b><select id="scale"><option value="1">1x</option><option value="2" selected>2x</option><option value="3">3x</option></select></label><label class="scale"><b>VELOCIDADE</b><select id="speed"><option value="1" selected>1x</option><option value="2">2x</option></select></label><span id="status">Nenhuma ROM carregada.</span></div>
<div id="game"><canvas id="screen" width="240" height="160"></canvas></div>
<div class="small">Core: mGBA/C WebAssembly. Interface: JavaScript. O emulador roda localmente no navegador.</div>
</section></main>
<script type="module">
import { load } from "https://cdn.jsdelivr.net/npm/@wasm-gaming/mgba-wasm@0.1.1/dist/mgba/mgba.sdk.js";
const input=document.getElementById("rom"),status=document.getElementById("status"),canvas=document.getElementById("screen"),scale=document.getElementById("scale"),speed=document.getElementById("speed");
let speedMultiplier=Number(speed.value)||1;
let romBytes=null;
const nativeAddModule=AudioWorklet.prototype.addModule;
AudioWorklet.prototype.addModule=async function(url,options){
  if(speedMultiplier===1 || typeof url!=="string" || !url.startsWith("blob:")) return nativeAddModule.call(this,url,options);
  const source=await (await fetch(url)).text();
  const patched=source.replace("this.ratio = msg.rate / sampleRate;","this.ratio = (msg.rate / sampleRate) * 2;");
  const patchedUrl=URL.createObjectURL(new Blob([patched],{type:"application/javascript"}));
  try{return await nativeAddModule.call(this,patchedUrl,options)}finally{URL.revokeObjectURL(patchedUrl)}
}
async function startEmulator(){
 if(!romBytes)return;
 try{
   status.textContent="Carregando mGBA…";
   if(engine){try{engine.destroy?.()}catch{} engine=null}
   engine=await load({canvasEl:canvas,assets:{rom:romBytes},options:{system:"gba",aspect:"native",idleOptimization:"remove",renderFilter:"pixelated"},persist:"opfs",storageNamespace:"pokemon-firered"});
   engine.start();
   status.textContent=speedMultiplier===2?"ROM carregada — velocidade 2x.":"ROM carregada — velocidade normal.";
 }catch(err){console.error(err);status.textContent="Erro ao iniciar: "+(err?.message||String(err))}
}
speed.addEventListener("change",async()=>{speedMultiplier=Number(speed.value)||1;if(romBytes)await startEmulator()});
function applyScale(){const n=Number(scale.value)||2; canvas.style.width=(240*n)+"px"; canvas.style.maxWidth="100%"; canvas.style.height="auto"}
scale.addEventListener("change",applyScale); applyScale();
let engine=null;
input.addEventListener("change",async()=>{
 const file=input.files?.[0]; if(!file)return;
 if(!/\.gba$/i.test(file.name)){status.textContent="Selecione um arquivo .gba.";return}
 try{
   status.textContent="Carregando mGBA WebAssembly…";
   if(engine){try{engine.destroy?.()}catch{} engine=null}
   romBytes=new Uint8Array(await file.arrayBuffer());
   await startEmulator();
 }catch(err){
   console.error(err);
   status.textContent="Erro ao iniciar: "+(err?.message||String(err));
 }
});
</script></body></html>
